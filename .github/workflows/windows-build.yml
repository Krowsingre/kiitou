name: Kiitou Windows build and executable release

on:
  push:
    branches: ['**']
    paths:
      - 'Kiitou/**'
      - 'Kiitou.Core/**'
      - 'Kiitou.Tests/**'
      - 'assets/**'
      - '.github/**'
      - 'installer/**'
      - 'version.txt'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kiitou-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Show build environment
        run: dotnet --info

      - name: Run automated tests
        env:
          KIITOU_CI: '1'
        run: dotnet test Kiitou.Tests/Kiitou.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish self-contained executable
        run: >
          dotnet publish Kiitou/Kiitou.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o out

      - name: Verify single executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "out/Kiitou.exe"
          if (-not (Test-Path $exe)) { throw "Kiitou.exe was not published" }
          $other = Get-ChildItem out -File | Where-Object { $_.Name -ne "Kiitou.exe" }
          if ($other) { throw ("Unexpected sidecar files: " + ($other.Name -join ", ")) }
          Write-Host "Verified publish output: Kiitou.exe"
          Get-Item $exe | Select-Object Name, Length

      - name: Use a screen large enough for the window
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1280 -Height 800 -Force

      - name: Smoke test the executable
        shell: pwsh
        run: ./.github/scripts/smoke.ps1 -Exe out/Kiitou.exe -ShotDir shots

      - name: Tour every view and theme
        shell: powershell
        run: ./.github/scripts/ui-tour.ps1 -Exe out/Kiitou.exe -ShotDir shots

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not available" }
          & $iscc /Qp "/DAppVersion=$version" installer\Kiitou.iss
          if ($LASTEXITCODE -ne 0) { throw "The installer could not be built" }
          Get-Item "out-installer/Kiitou-Setup-$version.exe" | Select-Object Name, Length

      - name: Test the installer
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          ./.github/scripts/installer-test.ps1 -Setup "out-installer/Kiitou-Setup-$version.exe" -Version $version

      - name: Upload smoke test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: shots
          if-no-files-found: ignore

      - name: Keep the installer from this build
        uses: actions/upload-artifact@v4
        with:
          name: kiitou-setup
          path: out-installer/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.KIITOU_UPDATE_SIGNING_KEY }}
        run: ./.github/scripts/publish-release.ps1 -Commit ${{ github.sha }}
